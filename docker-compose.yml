services:
  app:
    image: docker.io/library/onlydrinks:1.0-SNAPSHOT
    container_name: onlydrinks-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-onlydrinks}
      DB_USERNAME: ${DB_USERNAME:-onlydrinks}
      DB_PASSWORD: ${DB_PASSWORD:?Database password required}
      SSL_KEYSTORE_PATH: file:/certs/keystore.p12
      SSL_KEYSTORE_PASSWORD: ${SSL_KEYSTORE_PASSWORD:?SSL keystore password required}
      MANAGEMENT_SERVER_PORT: "8081"
      MANAGEMENT_SERVER_SSL_ENABLED: "false"
      THC_PATH: "/actuator/health"
      THC_PORT: 8081
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_USERNAME}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
    volumes:
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "/workspace/health-check"]
      interval: 3s
      timeout: 3s
      retries: 3
      start_period: 3s
    networks:
      - onlydrinks-network

  nginx:
    image: nginx:alpine
    container_name: onlydrinks-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
      - "${APP_SSL_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - onlydrinks-network

  postgres:
    image: postgres:18-alpine
    container_name: onlydrinks-postgres
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/postgres-ssl-entrypoint.sh"]
    environment:
      POSTGRES_DB: ${DB_NAME:-onlydrinks}
      POSTGRES_USER: ${DB_USERNAME:-onlydrinks}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./certs:/etc/ssl/certs/onlydrinks:ro
      - ./scripts/postgres-ssl-entrypoint.sh:/usr/local/bin/postgres-ssl-entrypoint.sh:ro
    ports:
      # Bind to loopback only: local access for inspection, not exposed to the network.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    command:
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/tls/db.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/tls/db.key
      - -c
      - ssl_ca_file=/var/lib/postgresql/tls/ca.crt
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-onlydrinks}"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - onlydrinks-network

volumes:
  postgres_data:
    driver: local

networks:
  onlydrinks-network:
    driver: bridge
