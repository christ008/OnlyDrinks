server:
  shutdown: graceful
  http2:
    enabled: true
  server-header: ""
  max-http-request-header-size: 16KB
  ssl:
    enabled: true
    key-store: ${SSL_KEYSTORE_PATH:file:/certs/keystore.p12}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:changeme}
    key-store-type: PKCS12
    key-alias: onlydrinks
  compression:
    enabled: true
    min-response-size: 2KB
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        secure: true
        same-site: lax
  tomcat:
    threads:
      max: 400
      min-spare: 20
    accept-count: 200
    max-connections: 8192
    connection-timeout: 5s
    keep-alive-timeout: 20s
    max-keep-alive-requests: 100
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:onlydrinks}?ssl=true&sslmode=verify-full&sslrootcert=/certs/ca.crt
    username: ${DB_USERNAME:onlydrinks}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  web:
    error:
      include-message: never
      include-stacktrace: never

vaadin:
  launch-browser: false

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
    ssl:
      enabled: ${MANAGEMENT_SERVER_SSL_ENABLED:false}

app:
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      name: ${BOOTSTRAP_ADMIN_NAME:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
