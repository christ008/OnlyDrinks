server:
  port: ${PORT:8080}

logging:
  level:
    org.atmosphere: warn

vaadin:
  allowed-packages: com.vaadin,org.vaadin,com.flowingcode,uy.christian
  pnpm:
    enable: true


spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-on-migrate: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health
